# PostgreSQL Configuration (Dev)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url}
spring.datasource.username=${DB_USER:url}
spring.datasource.password=${DB_PASSWORD:url}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & Flyway: validação contra migrations no banco PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration (Dev)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Cache Configuration
app.cache.redis.ttl=24h
