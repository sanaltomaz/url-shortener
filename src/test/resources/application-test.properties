spring.application.name=url-shortener-test

# Conexão H2 em memória exclusiva para testes automatizados
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console web visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate & Flyway: validação contra migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration (Ambiente de Testes)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache Configuration
app.cache.redis.ttl=24h
