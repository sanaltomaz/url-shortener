services:
  postgres:
    image: postgres:latest
    container_name: url-shortener-postgres
    environment:
      POSTGRES_DB: url
      POSTGRES_USER: url
      POSTGRES_PASSWORD: url
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
